plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Exclude integration files for dependencies not yet available for 26.1.2
sourceSets.main.java.exclude(
    '**/external/create/**',
    '**/external/mekanism/**'
)

sourceSets.main.resources { srcDir 'src/generated/resources' }

neoForge {
    version = project.neo_version

    // parchment {
    //     mappingsVersion = project.parchment_mappings_version
    //     minecraftVersion = project.parchment_minecraft_version
    // }
    // No Parchment mappings available for 26.1.2 yet

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = "ParchmentMC"
        url = "https://ldtteam.jfrog.io/artifactory/parchmentmc-public"
    }
    maven {
        name = "JEI Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
        content {
            includeGroup "mekanism"
        }
    }
    maven {
        name = "Blake's Mods Maven"
        url = "https://maven.blakesmods.com"
    }
    maven {
        name = "CurseForge Maven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
    }
}

dependencies {
    compileOnly "maven.modrinth:jade:26.1.1+neoforge"
    compileOnly "mezz.jei:jei-26.1.2-neoforge-api:29.5.0.28"
    compileOnly "top.theillusivec4.curios:curios-neoforge:15.0.0-beta.2+26.1.2:api"
    //compileOnly "mekanism:Mekanism:1.21.1-10.7.15.81:api"
    //compileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.2.1298"
    compileOnly "com.blakebr0.cucumber:Cucumber:26.1.2-9.0.2"
    compileOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:26.1.2-9.0.3"
    //compileOnly("curse.maven:create-328085:7408951") { transitive = false }
    //compileOnly "maven.modrinth:emi:${emi_version}"
    //compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "2000" << "-Xmaxwarns" << "2000" << "-Xlint:deprecation" << "-Xlint:unchecked"
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.50.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
