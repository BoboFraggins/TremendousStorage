plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.173'
    id 'com.diffplug.spotless' version '7.0.2'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Exclude integration files for dependencies not yet available on 1.21.4
sourceSets.main.java.exclude(
    '**/external/create/**',
    '**/external/mekanism/**',
    '**/external/jade/**',
    '**/*JadePlugin.java',
    '**/storage/networkinterface/NetworkInterfaceJadePlugin.java',
    '**/storage/tube/TubeJadePlugin.java',
    '**/storage/tank/TankJadePlugin.java',
    '**/storage/filingcabinet/FilingCabinetJadePlugin.java',
    '**/storage/chest/ChestJadePlugin.java',
    '**/storage/accessterminal/AccessTerminalJadePlugin.java',
    '**/external/mysticalagriculture/**',
    '**/lazurite/LazuriteCropPlugin.java',
    '**/external/jei/**'
)

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenLocal()
    maven { url "https://api.modrinth.com/maven" }
    maven {
        name = "JEI Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
        content {
            includeGroup "mekanism"
        }
    }
    maven {
        name = "Blake's Mods Maven"
        url = "https://maven.blakesmods.com"
    }
    maven {
        name = "CurseForge Maven"
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven {
        name = "shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly "maven.modrinth:jade:26.1.1+neoforge"
    compileOnly "mezz.jei:jei-1.21.4-neoforge-api:20.0.0.4"
    compileOnly "top.theillusivec4.curios:curios-neoforge:10.0.1+1.21.4:api"
    //compileOnly "mekanism:Mekanism:1.21.1-10.7.15.81:api"
    //compileOnly "com.hollingsworth.ars_nouveau:ars_nouveau-1.21.1:5.11.2.1298"
    //compileOnly "com.blakebr0.cucumber:Cucumber:1.21.1-8.0.15"
    //compileOnly "com.blakebr0.mysticalagriculture:MysticalAgriculture:1.21.1-8.0.23"
    //compileOnly "maven.modrinth:structure-pool-api:${structure_pool_api_version}"
    //compileOnly("curse.maven:create-328085:7408951") { transitive = false }
    // Recipe viewer integrations — optional at runtime, compile-only for API access
    //compileOnly "maven.modrinth:emi:${emi_version}"
    //compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

afterEvaluate {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xmaxerrs" << "2000" << "-Xmaxwarns" << "2000" << "-Xlint:deprecation" << "-Xlint:unchecked"
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        palantirJavaFormat('2.50.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
